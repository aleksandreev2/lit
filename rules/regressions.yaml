book_id: SISTEMA_BOGATSTVA
schema_version: 4
rules:
  - id: SB-DIA-001
    owner_family: dialogue
    severity: BLOCK
    name: TELEGRAPH_AI_PING_PONG
    description: >-
      Do not build calm dialogue from chained minimal service turns. Short turns
      require a pragmatic reason.
    positive_examples:
      - "A short reply is justified by interruption, urgency, shock, or action."
    negative_examples:
      - "Three or more calm service replies merely shuttle exposition back and forth."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_qa_artifacts.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-DIA-002
    owner_family: dialogue
    severity: BLOCK
    name: CONVENIENT_QUESTION
    description: >-
      A question must belong to the character, not exist only to cue the next
      exposition answer.
    positive_examples:
      - "The question follows from the speaker's goal, confusion, or missing knowledge."
    negative_examples:
      - "A generic question exists only so the next speaker can explain a large fact block."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_qa_artifacts.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-DIA-003
    owner_family: dialogue
    severity: BLOCK
    name: REVIEWER_AGENT
    description: >-
      Characters must not routinely certify German's answer as logical, honest,
      or correct for the reader.
    positive_examples:
      - "A reaction advances the character's own goal or emotion."
    negative_examples:
      - "The listener says the equivalent of 'logical' only to certify exposition."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_qa_artifacts.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-DIA-004
    owner_family: dialogue
    severity: BLOCK
    name: SEMANTIC_ECHO
    description: >-
      Do not automatically mirror an already-complete instruction or meaning in
      the next turn.
    positive_examples:
      - "The next turn adds a new intention, objection, detail, or emotional consequence."
    negative_examples:
      - "The next speaker restates the same completed instruction in different words."
    detection_type: SEMANTIC
    fixture_test_path: null
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-DIA-005
    owner_family: dialogue
    severity: REVIEW
    name: MICRO_PUNCHLINE_DEFAULT
    description: >-
      Do not force clever symmetrical one-liners or witty comeback closure into
      ordinary dialogue.
    positive_examples:
      - "Ordinary speech may end unevenly, practically, or without a punchline."
    negative_examples:
      - "Every exchange closes with a neat mirrored joke or comeback."
    detection_type: SEMANTIC
    fixture_test_path: null
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-KNW-001
    owner_family: knowledge
    severity: BLOCK
    name: KNOWLEDGE_PROVENANCE
    description: >-
      Exact secret, sum, or private fact used by a character needs an on-page or
      approved source, explicit inference, or current reveal.
    positive_examples:
      - "Knowledge ledger records how and when the character acquired the fact."
    negative_examples:
      - "A character knows a private exact amount with no witnessed, told, or inferred source."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_provenance.py
    affected_stages: [PREWRITE, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-CHR-001
    owner_family: character
    severity: BLOCK
    name: MILENA_ACCESS_GATE
    description: >-
      No expensive request or material flirt before an earned social bridge and
      personal recognition.
    positive_examples:
      - "Material escalation follows an established social bridge and recognition."
    negative_examples:
      - "An expensive request appears before the relationship has earned that access."
    detection_type: SEMANTIC
    fixture_test_path: null
    affected_stages: [PREWRITE, DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: inherited-project-rule
    superseded_by: null

  - id: SB-CHR-002
    owner_family: character
    severity: BLOCK
    name: GERMAN_EXPERTISE_LEAP
    description: >-
      Wealth does not instantly make German expert in finance, crypto, business,
      cars, sex, fashion, or property.
    positive_examples:
      - "German researches, asks, experiments, or relies on a specialist where appropriate."
    negative_examples:
      - "New wealth is treated as automatic expert competence in an unrelated domain."
    detection_type: SEMANTIC
    fixture_test_path: null
    affected_stages: [PREWRITE, DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: inherited-project-rule
    superseded_by: null

  - id: SB-PROC-001
    owner_family: process
    severity: BLOCK
    name: FROZEN_HASH_MISMATCH
    description: >-
      Any post-freeze dependency change invalidates dependent QA until rerun
      against the exact revision hash.
    positive_examples:
      - "Changed runtime marks continuity QA, freeze, and release artifacts stale."
    negative_examples:
      - "A previous PASS remains valid after a bound dependency hash changes."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_invalidation.py
    affected_stages: [FINAL_TEXT_FROZEN, AUTHOR_APPROVED, HAPPENED]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-RES-001
    owner_family: research
    severity: BLOCK
    name: SEARCH_FIRST_REALITY
    description: >-
      Date-sensitive or real-world claims require research evidence appropriate
      to story date and location before prose promotion.
    positive_examples:
      - "A volatile claim is linked to a scoped research record with freshness metadata."
    negative_examples:
      - "A current price is reused as an exact historical price without historical evidence."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_provenance.py
    affected_stages: [PREWRITE, QA_IN_PROGRESS, FINAL_CANDIDATE, FINAL_TEXT_FROZEN]
    introduced_by: bootstrap-v2-2026-08-14
    superseded_by: null

  - id: SB-RUS-001
    owner_family: russian_naturalness
    severity: BLOCK
    name: BARE_PERSONAL_LADNO
    description: >-
      Bare personal pronoun plus "ладно" is not a complete Russian state
      construction and is a high-confidence machine-Russian signal.
    positive_examples:
      - "Ладно."
      - "Я, ладно, пойду домой."
    negative_examples:
      - "Я ладно."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v1-2026-08-14
    superseded_by: null
    matcher:
      type: TOKEN_PATTERN
      tokens:
        - any_of: [я, ты, он, она, мы, вы, они]
        - any_of: [ладно]
      skip_if_question: false
      confidence: HIGH
      message: >-
        Incomplete personal-state construction: "ладно" cannot normally stand
        as the predicate of a bare personal pronoun.
      suggestions:
        - "Ладно."
        - "Я в порядке."

  - id: SB-RUS-002
    owner_family: russian_naturalness
    severity: BLOCK
    name: BARE_PERSONAL_STATE_ADVERB
    description: >-
      Bare personal pronoun plus a state adverb in a standalone statement is a
      high-confidence machine-like fragment or a dropped verb/complement.
    positive_examples:
      - "Я нормально себя чувствую."
      - "У меня всё нормально."
      - "Ты нормально?"
    negative_examples:
      - "Я нормально."
      - "Она хорошо."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v1-2026-08-14
    superseded_by: null
    matcher:
      type: TOKEN_PATTERN
      tokens:
        - any_of: [я, ты, он, она, мы, вы, они]
        - any_of: [нормально, хорошо, плохо]
      skip_if_question: true
      confidence: HIGH
      message: >-
        Incomplete personal-state predicate in a standalone statement; a
        required verb, complement, or Russian possessive-state construction is missing.
      suggestions:
        - "Я в порядке."
        - "У меня всё нормально."
        - "Я нормально себя чувствую."

  - id: SB-RUS-003
    owner_family: russian_naturalness
    severity: BLOCK
    name: PERSONAL_ALL_STATE_FRAGMENT
    description: >-
      Personal pronoun plus "всё/все" plus a state adverb without a finite verb
      is normally a malformed fragment.
    positive_examples:
      - "Я всё нормально сделал."
      - "У меня всё нормально."
    negative_examples:
      - "Я всё нормально."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v1-2026-08-14
    superseded_by: null
    matcher:
      type: TOKEN_PATTERN
      tokens:
        - any_of: [я, ты, он, она, мы, вы, они]
        - any_of: [всё, все]
        - any_of: [нормально, хорошо, плохо]
      skip_if_question: true
      confidence: HIGH
      message: >-
        Broken personal-state fragment; likely missing an "у меня/него..."
        construction or a finite verb.
      suggestions:
        - "У меня всё нормально."
        - "Я всё нормально сделал."

  - id: SB-RUS-004
    owner_family: russian_naturalness
    severity: REVIEW
    name: BARE_PERSONAL_TIME_ADVERB
    description: >-
      Bare personal pronoun plus "рано/поздно" can be an over-compressed calque
      or a missing-verb fragment.
    positive_examples:
      - "Ты рано пришёл."
      - "Я поздно вернулся."
    negative_examples:
      - "Ты рано."
      - "Он поздно."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v1-2026-08-14
    superseded_by: null
    matcher:
      type: TOKEN_PATTERN
      tokens:
        - any_of: [я, ты, он, она, мы, вы, они]
        - any_of: [рано, поздно]
      skip_if_question: true
      confidence: MEDIUM
      message: >-
        Possible missing-verb temporal construction; verify that the ellipsis
        is deliberate and natural in context.
      suggestions:
        - "Ты рано пришёл."
        - "Он поздно вернулся."

  - id: SB-RUS-005
    owner_family: russian_naturalness
    severity: BLOCK
    name: ACCORDING_REQUIRES_DATIVE
    description: >-
      The preposition "согласно" governs the dative case in standard Russian.
    positive_examples:
      - "Согласно приказу директора, офис закроют раньше."
      - "Согласно его приказу, офис закроют раньше."
    negative_examples:
      - "Согласно приказа директора, офис закроют раньше."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: CASE_AFTER
      trigger_lemmas: [согласно]
      allowed_cases: [datv]
      target_pos: [NOUN]
      max_scan: 4
      skip_if_question: false
      confidence: HIGH
      message: >-
        "Согласно" requires the dative case; the following noun is parsed in a
        different case.
      suggestions:
        - "Согласно приказу директора..."

  - id: SB-RUS-006
    owner_family: russian_naturalness
    severity: BLOCK
    name: DESPITE_REQUIRES_DATIVE
    description: >-
      The preposition "вопреки" governs the dative case in standard Russian.
    positive_examples:
      - "Вопреки приказу он остался."
    negative_examples:
      - "Вопреки приказа он остался."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: CASE_AFTER
      trigger_lemmas: [вопреки]
      allowed_cases: [datv]
      target_pos: [NOUN]
      max_scan: 4
      skip_if_question: false
      confidence: HIGH
      message: >-
        "Вопреки" requires the dative case; the following noun is parsed in a
        different case.
      suggestions:
        - "Вопреки приказу он остался."

  - id: SB-RUS-007
    owner_family: russian_naturalness
    severity: BLOCK
    name: PAY_FOR_GOVERNMENT
    description: >-
      "Оплатить" takes a direct object; "за" belongs with "заплатить" in this construction.
    positive_examples:
      - "Я оплатил квартиру."
      - "Я заплатил за квартиру."
    negative_examples:
      - "Я оплатил за квартиру."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [оплатить]
        - any_of: [за]
      max_gap: 0
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Nonstandard government: use "оплатить что" or "заплатить за что".
      suggestions:
        - "Я оплатил квартиру."
        - "Я заплатил за квартиру."

  - id: SB-RUS-008
    owner_family: russian_naturalness
    severity: BLOCK
    name: DISCUSS_WITHOUT_O
    description: >-
      "Обсудить" takes a direct object and does not normally govern "о/об" directly.
    positive_examples:
      - "Мы обсудили проблему."
      - "Мы обсудили вопрос о переезде."
    negative_examples:
      - "Мы обсудили о проблеме."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [обсудить]
        - any_of: [о, об, обо]
      max_gap: 0
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Broken government after "обсудить"; use a direct object or another verb
        such as "поговорить о".
      suggestions:
        - "Мы обсудили проблему."
        - "Мы поговорили о проблеме."

  - id: SB-RUS-009
    owner_family: russian_naturalness
    severity: BLOCK
    name: HOPE_REQUIRES_NA
    description: >-
      "Надеяться" normally governs "на", not "о/об", for the hoped-for outcome.
    positive_examples:
      - "Я надеюсь на победу."
    negative_examples:
      - "Я надеюсь о победе."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [надеяться]
        - any_of: [о, об, обо]
      max_gap: 0
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Broken government after "надеяться"; the intended Russian construction
        is normally "надеяться на".
      suggestions:
        - "Я надеюсь на победу."

  - id: SB-RUS-010
    owner_family: russian_naturalness
    severity: BLOCK
    name: INTERESTED_WITHOUT_O
    description: >-
      "Интересоваться" governs the instrumental case rather than "о/об" directly.
    positive_examples:
      - "Я интересуюсь проектом."
    negative_examples:
      - "Я интересуюсь о проекте."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [интересоваться]
        - any_of: [о, об, обо]
      max_gap: 0
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Broken government after "интересоваться"; use the instrumental case.
      suggestions:
        - "Я интересуюсь проектом."

  - id: SB-RUS-011
    owner_family: russian_naturalness
    severity: BLOCK
    name: CONCERN_WITHOUT_O
    description: >-
      "Касаться" governs the genitive case and does not take "о/об" directly.
    positive_examples:
      - "Это касается проблемы."
    negative_examples:
      - "Это касается о проблеме."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [касаться]
        - any_of: [о, об, обо]
      max_gap: 0
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Broken government after "касаться"; use a genitive object without "о/об".
      suggestions:
        - "Это касается проблемы."

  - id: SB-RUS-012
    owner_family: russian_naturalness
    severity: BLOCK
    name: MAKE_SENSE_CALQUE
    description: >-
      A form of "делать смысл" is a high-confidence calque of English "make sense".
    positive_examples:
      - "Это имеет смысл."
      - "В этом есть смысл."
    negative_examples:
      - "Это делает смысл."
      - "Это не делает никакого смысла."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [делать]
        - any_of: [смысл]
      max_gap: 2
      require_full_sentence: false
      skip_if_question: false
      confidence: HIGH
      message: >-
        Likely English calque "make sense"; Russian normally uses "иметь смысл"
        or "в этом есть смысл".
      suggestions:
        - "Это имеет смысл."
        - "В этом есть смысл."

  - id: SB-RUS-013
    owner_family: russian_naturalness
    severity: REVIEW
    name: HAVE_IDEA_CALQUE
    description: >-
      Bare "я имею идею" is grammatical but usually sounds translated or marked in modern dialogue.
    positive_examples:
      - "У меня есть идея."
      - "Есть идея."
    negative_examples:
      - "Я имею идею."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [я]
        - any_of: [иметь]
        - any_of: [идея]
      max_gap: 0
      require_full_sentence: true
      skip_if_question: false
      confidence: MEDIUM
      message: >-
        Possible possession calque in dialogue; verify that the marked phrasing is intentional.
      suggestions:
        - "У меня есть идея."
        - "Есть идея."

  - id: SB-RUS-014
    owner_family: russian_naturalness
    severity: REVIEW
    name: HAVE_QUESTION_CALQUE
    description: >-
      Bare "я имею вопрос" is a common translation-shaped construction in modern dialogue.
    positive_examples:
      - "У меня вопрос."
      - "Можно задать вопрос?"
    negative_examples:
      - "Я имею вопрос."
    detection_type: HEURISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
    superseded_by: null
    matcher:
      type: LEMMA_WINDOW
      lemmas:
        - any_of: [я]
        - any_of: [иметь]
        - any_of: [вопрос]
      max_gap: 0
      require_full_sentence: true
      skip_if_question: false
      confidence: MEDIUM
      message: >-
        Possible possession calque; in ordinary Russian dialogue "у меня вопрос"
        is usually more natural.
      suggestions:
        - "У меня вопрос."
        - "Можно задать вопрос?"

  - id: SB-RUS-015
    owner_family: russian_naturalness
    severity: BLOCK
    name: TAKE_SHOWER_CALQUE
    description: >-
      "Взять душ" is a high-confidence English-influenced collocation in standard Russian prose.
    positive_examples:
      - "Я принял душ."
      - "Я сходил в душ."
    negative_examples:
      - "Я взял душ."
    detection_type: DETERMINISTIC
    fixture_test_path: tests/test_russian_naturalness.py
    affected_stages: [DRAFT_READY_FOR_EDITOR, QA_IN_PROGRESS, FINAL_CANDIDATE]
    introduced_by: russian-naturalness-v2-2026-08-14
