[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-bogatstva-production"
version = "0.1.0"
description = "Deterministic production and continuity QA for the novel project Sistema Bogatstva"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.26,<5",
  "pymorphy3==2.0.6",
  "razdel>=0.5.0,<1",
]

[project.optional-dependencies]
qa = [
  "pip-audit==2.10.1",
  "pytest>=8.3,<9",
  "ruff==0.16.0",
  "yamllint>=1.37,<2",
]
grammar = [
  "language-tool-python>=2.9,<3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
