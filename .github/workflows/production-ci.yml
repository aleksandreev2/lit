name: Production CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required production engine gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install QA dependencies
        run: python -m pip install '.[qa]'

      - name: Project preflight
        run: python scripts/project_preflight.py

      - name: Structured state and provenance
        run: python scripts/provenance_check.py

      - name: Regression lock metadata and fixtures
        run: python scripts/regression_check.py

      - name: Russian naturalness regression corpus
        run: python scripts/russian_naturalness.py --self-test

      - name: Pronoun coreference regression corpus
        run: python scripts/pronoun_coreference.py --self-test

      - name: Semantic coreference regression corpus
        run: python scripts/semantic_coreference.py --self-test

      - name: Dependency DAG
        run: python scripts/dependency_graph.py config/dependency_graph.yaml

      - name: Prove runtime invalidation path
        run: python scripts/dependency_graph.py config/dependency_graph.yaml --changed runtime

      - name: Drive sync contract
        run: python scripts/sync_conflicts.py sync/manifest.yaml

      - name: YAML lint
        run: yamllint canon config current research rules sync templates tests/fixtures

      - name: Python lint
        run: ruff check scripts tests

      - name: Invariant and contract tests
        run: pytest -q

      - name: Build QA report
        id: qa_report
        if: ${{ always() }}
        run: python scripts/qa_report.py qa-report --revision "$GITHUB_SHA"

      - name: Verify QA report
        if: ${{ always() && steps.qa_report.outcome == 'success' }}
        run: python scripts/qa_report_check.py qa-report

      - name: Upload QA report
        if: ${{ always() && steps.qa_report.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-report
          path: qa-report
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit project dependencies
        run: pip-audit . --progress-spinner off

  workflow-security:
    name: GitHub Actions security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          collect: workflows
          persona: regular
          min-severity: medium
          min-confidence: medium
          version: "1.29.0"

  vale:
    name: Vale deterministic prose/meta rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff
        with:
          files: '["README.md", "docs"]'
          fail_on_error: true
          version: "3.17.1"
