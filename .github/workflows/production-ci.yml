name: Production CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    name: required production engine gates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install QA dependencies
        run: python -m pip install '.[qa]'

      - name: Project preflight
        run: python scripts/project_preflight.py

      - name: Structured state and provenance
        run: python scripts/provenance_check.py

      - name: Regression lock metadata and fixtures
        run: python scripts/regression_check.py

      - name: Dependency DAG
        run: python scripts/dependency_graph.py config/dependency_graph.yaml

      - name: Prove runtime invalidation path
        run: python scripts/dependency_graph.py config/dependency_graph.yaml --changed runtime

      - name: YAML lint
        run: yamllint canon config current research rules templates

      - name: Python lint
        run: ruff check scripts tests

      - name: Invariant and contract tests
        run: pytest -q

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit project dependencies
        run: pip-audit . --progress-spinner off

  vale:
    name: Vale deterministic prose/meta rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff
        with:
          files: '["README.md", "docs"]'
          fail_on_error: true
          version: "3.17.1"
