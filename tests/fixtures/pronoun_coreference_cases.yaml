    text: "Герман вошёл в комнату. Он достал телефон."
    expected_rules: []
    guards_rules: [SB-PRN-001]
    expected_status: PASS

  - id: gender_conflict
    text: "Анна закрыла дверь. Он снял куртку."
    expected_rules: [SB-PRN-002]
    expected_status: REVIEW

  - id: gender_match_guard
    text: "Анна закрыла дверь. Она сняла куртку."
    expected_rules: []
    guards_rules: [SB-PRN-002]
    expected_status: PASS

  - id: common_noun_antecedent_guard
    text: "Анна взяла телефон. Он зазвонил."
    expected_rules: []
    guards_rules: [SB-PRN-002]
    expected_status: PASS

  - id: plural_pair_group_guard
    text: "Анна встретила Милену. Они ушли вместе."
